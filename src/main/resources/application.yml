spring:
  application:
    name: alerting-service
  datasource:
    url: jdbc:h2:mem:alerting;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    # Liquibase owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: true
  # SMTP server for the EMAIL channel. Defaults to a local mail catcher (e.g. Mailpit/MailHog on 1025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  # Outgoing HTTP calls (Slack webhooks): never let a slow endpoint hang a sender thread.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

alerting:
  channels:
    email:
      from: ${ALERTING_EMAIL_FROM:alerts@alerting.local}
  notification:
    # Events older than this when detected are stored but not notified (no burst of old news
    # on the first run after a restart).
    max-event-age: 10m
    retry:
      # Every attempt counts, the first send included: 1 send + 3 retries.
      max-attempts: 4
      # Wait before retry 1, 2, 3 (the last delay repeats if max-attempts needs more).
      backoff: 1m, 5m, 15m
      tick: 30s
      batch-size: 100
  detection:
    # How often the scheduler checks which sources are due; each source has its own interval.
    tick: 15s
    scheduling-enabled: true
  sources:
    fake:
      enabled: true
      interval: 15s
    usgs:
      enabled: true
      interval: 5m
      # All earthquakes M2.5+ from the past day; dedup makes re-reading the same window harmless.
      url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson
    rss:
      enabled: true
      interval: 10m
      url: https://feeds.bbci.co.uk/news/world/rss.xml
      default-severity: MEDIUM
      # Whole words, case-insensitive; a trailing * matches a prefix (evacuat* -> evacuation).
      high-severity-keywords: breaking, killed, dead, war, attack*, explosion*, earthquake*, tsunami*, evacuat*
    coingecko:
      enabled: true
      interval: 5m
      url: https://api.coingecko.com/api/v3/simple/price
      coins: bitcoin, ethereum, solana
