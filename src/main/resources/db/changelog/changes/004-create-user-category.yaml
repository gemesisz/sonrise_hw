databaseChangeLog:
  - changeSet:
      id: 004-create-user-category
      author: gemesisz
      changes:
        - createTable:
            tableName: user_category
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: min_severity
                  type: VARCHAR(20)
                  defaultValue: LOW
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_category
            columnNames: user_id, category_id
            constraintName: pk_user_category
        # A subscription belongs to its user: deleting the user removes it.
        - addForeignKeyConstraint:
            baseTableName: user_category
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_user_category_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_category
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_user_category_category
        - createIndex:
            tableName: user_category
            indexName: ix_user_category_category
            columns:
              - column:
                  name: category_id
