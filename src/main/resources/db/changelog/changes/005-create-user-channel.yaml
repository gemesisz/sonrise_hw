databaseChangeLog:
  - changeSet:
      id: 005-create-user-channel
      author: gemesisz
      changes:
        - createTable:
            tableName: user_channel
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # Channel-specific destination: email address, Slack webhook URL, phone number, ...
              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_channel
            columnNames: user_id, channel_id
            constraintName: pk_user_channel
        # A channel link belongs to its user: deleting the user removes it.
        - addForeignKeyConstraint:
            baseTableName: user_channel
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_user_channel_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_channel
            baseColumnNames: channel_id
            referencedTableName: channel
            referencedColumnNames: id
            constraintName: fk_user_channel_channel
        - createIndex:
            tableName: user_channel
            indexName: ix_user_channel_channel
            columns:
              - column:
                  name: channel_id
