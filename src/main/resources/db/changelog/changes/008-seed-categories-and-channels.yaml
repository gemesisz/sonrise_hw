            tableName: category
            columns:
              - column: { name: code, value: NATURAL_DISASTERS }
              - column: { name: name, value: Natural disasters }
              - column: { name: description, value: Earthquakes and other natural disasters }
        - insert:
            tableName: channel
            columns:
              - column: { name: code, value: EMAIL }
              - column: { name: name, value: Email }
        - insert:
            tableName: channel
            columns:
              - column: { name: code, value: SLACK }
              - column: { name: name, value: Slack }
