databaseChangeLog:
  - changeSet:
      id: 008-seed-categories-and-channels
      author: gemesisz
      changes:
        - insert:
            tableName: category
            columns:
              - column: { name: code, value: BREAKING_NEWS }
              - column: { name: name, value: Breaking news }
              - column: { name: description, value: Major world news headlines }
        - insert:
            tableName: category
            columns:
